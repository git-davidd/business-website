  <body class="bg">
    <!-- Navbar -->
    <div class="navbar">
      <a href="./index.html"
        ><img src="./assets/logo-square.png" class="nbl"
      /></a>
      <div class="nbd"></div>
      <a class="nbb active" title="U bent hier">Home</a>
      <a class="nbb" title="Coming soon">Over mij</a>
      <a class="nbb" title="Coming soon">Gallerij</a>
    </div>

    <!-- Homepage -->
    <div class="car">
      <div class="slide active">
        <img src="./assets/carousel/photo-1.jpg" />
      </div>
      <div class="slide">
        <img src="./assets/carousel/photo-2.jpg" />
      </div>
      <div class="slide">

      <div class="slide">

      <div class="slide">

        <img src="./assets/logo-horizontal-text.png" />
      </div>
      <div class="tc">
        <h1 class="tt">some catchy phrase here</h1>
      </div>
    </div>

    <!-- Scrolling script -->
    <script>
      const carousel = document.querySelector(".car");
      const slides = Array.from(carousel.querySelectorAll(".slide"));
      let index = Math.max(
        0,
        slides.findIndex((s) => s.classList.contains("active")),
      );

      setInterval(() => {
        const current = slides[index];
        index = (index + 1) % slides.length;
        const next = slides[index];

        current.after(next);
        current.classList.remove("active");
        next.classList.add("active");
      }, 7500);
    </script>

    <!-- Homepage content container -->
    <div class="hp-cc">
      <!-- Page content -->
      <h1>This is a title</h1>
      <h2>This is a header</h2>
      <p>This is a paragraph<br />there was a linebreak here</p>
      <p>This is a new paragraph</p>
    </div>
  </body>
